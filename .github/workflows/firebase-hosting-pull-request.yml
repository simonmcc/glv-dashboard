# Deploy dashboard to Firebase Hosting preview on PR
name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  VITE_MOCK_MODE: 'true'
  BUILD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Write Firebase credentials (fix deprecated token_uri)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GLV_DASHBOARD }}
        run: |
          echo "$FIREBASE_SA" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          d['token_uri'] = 'https://oauth2.googleapis.com/token'
          print(json.dumps(d))
          " > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> $GITHUB_ENV
      - name: Deploy to Firebase preview channel
        id: deploy
        run: |
          CHANNEL="pr${{ github.event.pull_request.number }}-preview"
          OUTPUT=$(npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
            --expires 7d \
            --project glv-dashboard \
            --json 2>/dev/null)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(list(d['result'].values())[0]['url'])
          " 2>/dev/null || echo "")
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        if: steps.deploy.outputs.preview_url != ''
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Visit the preview URL for this PR (updated for commit ${{ github.event.pull_request.head.sha }}):\n\n${{ steps.deploy.outputs.preview_url }}`
            })
