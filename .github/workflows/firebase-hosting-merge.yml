# Deploy dashboard to Firebase Hosting on merge to main
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_BACKEND_URL: https://glv-backend-gxoc276j2a-ew.a.run.app
  VITE_OTEL_ENABLED: 'true'
  BUILD_SHA: ${{ github.sha }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Write Firebase credentials (fix deprecated token_uri)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GLV_DASHBOARD }}
        run: |
          echo "$FIREBASE_SA" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          d['token_uri'] = 'https://oauth2.googleapis.com/token'
          print(json.dumps(d))
          " > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> $GITHUB_ENV
      - name: Deploy to Firebase live channel
        run: npx firebase-tools@latest deploy --only hosting --project glv-dashboard
